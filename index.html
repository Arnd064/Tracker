<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1526">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FlashBoard">
  <meta name="description" content="FlashBoard : organise tes révisions et prépare tes examens, sans compte ni abonnement.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>FlashBoard — Mes révisions</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">✦</div><div><span class="brand-name">FlashBoard</span><span class="brand-subtitle">Ton copilote de révisions</span></div></div>
      <button id="settings-btn" class="round-btn" type="button" aria-label="Réglages">⚙</button>
    </header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <button data-tab="home" class="active"><span aria-hidden="true">⌂</span><small>Aujourd'hui</small></button>
      <button data-tab="planning"><span aria-hidden="true">▦</span><small>Planning</small></button>
      <button data-tab="subjects"><span aria-hidden="true">▤</span><small>Matières</small></button>
      <button data-tab="exams"><span aria-hidden="true">◷</span><small>Examens</small></button>
      <button data-tab="stats"><span aria-hidden="true">▥</span><small>Suivi</small></button>
    </nav>
  </div>
  <dialog id="dialog" aria-label="Formulaire FlashBoard"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
